#{#
# This is a template for dynamically generating a Gitlab pipeline configuration for a release train and channel.
# It is meant to be used alongside the fastlane template to create dynamic pipelines for each train, according to git
# history and the .lhc configuration file.
#}{% if true %}
# This file is automatically generated. Do not edit it.
#{% endif %}

workflow:
  name: "{{ config.build.productName }} {{ config.build.platform }} {{ release.versionString }} ($TIMESTAMP)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

stages:
  - build
  - publish
  - test
  - deploy
  - test_ui
  - cleanup

variables:
  PIPELINE_HOST: "ci-geneva-cluster"
  # Use parallel compression/decompression to speed up caching
  FF_USE_FASTZIP: "true"
  # Low-effort compression to reduce bandwidth spent uploading/downloading, with some parallelism for speed
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  # We don't care about size of the caches since they're stored locally, just the time spent to zip/unzip them
  CACHE_COMPRESSION_LEVEL: "fastest"
  # Increase the timeout for resolving build settings
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 300
  # Unique timestamp according to the commit and pipeline ID
  TIMESTAMP: "{% include "timestamp.base" %}"
  BUILD_HOST_IDENTIFIER: "macos-{{ config.build.userProperties.platformVersion }}-xcode-{{ config.build.userProperties.toolchainVersion }}"
  RELEASE_PAGE_URL: "$CI_PAGES_URL/$CI_COMMIT_REF_SLUG/documentation/protonvpnrelease/"
  SWIFT_DETERMINISTIC_HASHING: 1

default:
  image: tahoe:26.4.22

include:
  - component: gitlab.protontech.ch/proton/devops/cicd-components/kits/devsecops/generic@0.0.10
    inputs:
      allowed-to-fail: true

{%- if config.releaseChannel == "production" and config.build.ci.tagName -%}{# Jobs amended in publish template #}
  - project: 'agarroux/publish-github'
    ref: feat/github-app
    file: '/jobs/release.gitlab-ci.yml'
{%- endif -%}

{%- if config.distribution.sparkle -%}
{%-
    if (config.releaseChannel == "alpha" and config.build.ci.tagName) or
       config.build.ci.refName == config.userProperties.releaseBranch
-%}{# Include the Nexus release upload jobs #}
{% for configuration, _ in config.build.configurations %}{# Jobs amended in publish template #}
  - component: "gitlab.protontech.ch/proton/devops/cicd-components/tools/artifactlift/release-candidate@0.1.36"
    inputs:
      stage: publish
      product: vpn
      version: "{{ short_version }}+{% include "timestamp" %}{% if configuration == "Debug-Staging" %}.staging{% endif %}"
      platform: macos
      artifact_list: "ProtonVPN_mac_v{{ short_version }}.dmg {% if configuration != "Debug-Staging" %} sparkle.signature {% endif %}"
      artifact_local_directory: "{{ config.build.outputDirectory }}/{{ configuration }}"
      {% if configuration == "Debug-Staging" %}
      job_prefix: staging-
      {% endif %}
{% endfor %}
{% elif config.build.ci.tagName -%}{# Include the Nexus release promotion jobs #}
  - component: "gitlab.protontech.ch/proton/devops/cicd-components/tools/artifactlift/release@0.1.36"
    inputs:
      stage: publish
      product: vpn
      version: "{{ release.versionString }}"
      platform: macos
      artifact_list: "ProtonVPN_mac_v{{ short_version }}.dmg sparkle.signature"
      # Retrieved from publish job, lives outside of the `artifacts` folder
      artifact_metadata_list: "../{{ config.build.outputDirectory }}/Release/sparkle.xml"
      artifact_metadata_path: "macos/updates/v5"
      artifact_local_directory: artifacts
{% endif %}
{% endif +%}

# BUILD CACHES
##############
# Caching is split into four independent objects so pipelines can share the branch-independent parts.
# build-* holds DerivedData (build products and intermediates) and stays branch-keyed, since a branch's Test jobs
# consume the products its Build jobs produced. cas-* holds Xcode's compilation cache, keyed by platform, host, and
# configuration. spm-* holds fetched Swift package checkouts and artifacts, keyed by platform and host. mint-* holds the
# Mint-managed build tools. The cas-* and spm-* caches are not branch-keyed, so every pipeline shares them.
.derived_data_cache_template:
  variables: &derived_data_cache_variables
    DERIVED_DATA_PATH: .caches/Xcode/DerivedData
    DERIVED_DATA_CACHE_POLICY: pull-push
    TRAIN_CACHE_KEY: "{{ config.build.platform }}-host-$BUILD_HOST_IDENTIFIER"
  cache:
    - &derived_data_cache_cache
      key: build-$TRAIN_CACHE_KEY-$CI_COMMIT_REF_SLUG
      paths:
        - $DERIVED_DATA_PATH
      policy: $DERIVED_DATA_CACHE_POLICY

# Xcode's compilation cache (CAS). It is relocated out of DerivedData by COMPILATION_CACHE_CAS_PATH, set in the Fastfile
# template's :xcargs, so it can be shared across branches independently of the branch-keyed DerivedData.
.compilation_cache_template:
  variables: &compilation_cache_variables
    # Keep this path in sync with COMPILATION_CACHE_CAS_PATH in Integration/Templates/fastlane/Fastfile.template.
    COMPILATION_CACHE_PATH: .caches/Xcode/CompilationCache
    COMPILATION_CACHE_POLICY: pull-push
  cache:
    - &compilation_cache_cache
      key: cas-$TRAIN_CACHE_KEY-$CONFIGURATION
      paths:
        - $COMPILATION_CACHE_PATH
      policy: $COMPILATION_CACHE_POLICY

# Swift package checkouts and binary artifacts, relocated out of DerivedData by cloned_source_packages_path (passed in
# the build job's fastlane args). Keyed by platform and host, since binary artifacts are platform-specific.
.spm_cache_template:
  variables: &spm_cache_variables
    SPM_PACKAGES_PATH: .caches/Xcode/SourcePackages
    SPM_CACHE_POLICY: pull-push
  cache:
    - &spm_cache_cache
      key:
        prefix: spm-$TRAIN_CACHE_KEY
        files:
          - libraries/Core/NEProviders/Package.swift
          - ProtonVPN.xcworkspace/xcshareddata/swiftpm/Package.resolved
      paths:
        - $SPM_PACKAGES_PATH
      policy: $SPM_CACHE_POLICY

.mint_cache_template:
  variables: &mint_cache_variables
    MINT_PATH: .caches/mint
    MINT_LINK_PATH: $MINT_PATH/bin
    MINT_CACHE_POLICY: pull-push
  cache:
    - &mint_cache_cache
      key:
        prefix: mint-xcode-{{ config.build.userProperties.toolchainVersion }}
        files:
          - Mintfile
      paths:
        - $MINT_PATH
      policy: $MINT_CACHE_POLICY

# Build jobs populate all four caches. GitLab allows a maximum of four cache objects per job.
.build_cache_template:
  variables:
    <<: *derived_data_cache_variables
    <<: *compilation_cache_variables
    <<: *spm_cache_variables
    <<: *mint_cache_variables
  cache:
    - *derived_data_cache_cache
    - *compilation_cache_cache
    - *spm_cache_cache
    - *mint_cache_cache

# Test jobs only consume the branch's DerivedData (built products) and the Mint tools. They neither compile nor resolve
# packages, so they skip the CAS and SPM caches. Their DerivedData and Mint policies are overridden to pull in the test
# job template.
.test_cache_template:
  variables:
    <<: *derived_data_cache_variables
    <<: *mint_cache_variables
  cache:
    - *derived_data_cache_cache
    - *mint_cache_cache

# JOB TEMPLATE
##############
# All jobs in this file extend this template.
.job_template:
  variables:
    # Tart mounts the host volume at /Volumes/My Shared Files, which breaks both Mint and GNU Make thanks to the space
    # in the filename. We create a symlink to our builddir so they can continue pretending that spaces don't exist.
    ARTIFACTS_DIR: "{{ config.build.outputDirectory }}/$CONFIGURATION"
  before_script:
    - ./Integration/Scripts/pipeline_setup.sh
  after_script: |
    # Delete all ssh private keys
    ssh-add -D
  interruptible: true

# BUILD STEP
############
# Creates app artifacts for shipping, and test bundles for running tests.
{% if channel == "alpha" or config.build.ci.eventType == "merge_request_event" %}
{% include "gitlab-build-job.yml" %}
{% endif %}

# PUBLISH STEP
##############
# Sends app binaries to the correct place, according to the release channel.
{% if config.build.ci.tagName or config.build.ci.refName == config.userProperties.releaseBranch %}
{% include "gitlab-publish-jobs.yml" %}
{% endif %}

# TEST STEP
###########
# Runs unit and partial/full UI tests depending on the context.
{% if channel == "alpha" or config.build.ci.eventType == "merge_request_event" %}
{% include "gitlab-test-jobs.yml" %}
{% endif %}

# ANNOUNCE STEP
##############
# Runs jobs announcing new builds and/or pipeline failures.
{% if config.build.userProperties.isSliTestEnabled != "true" %}
{% include "gitlab-announce-jobs.yml" %}
{% endif %}
